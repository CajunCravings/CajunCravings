<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cajun Cravings</title>
<style>
body{margin:0;background:#050604;color:#f0d99b;font-family:Georgia}
.hero{height:500px;background:#050604;display:flex;align-items:center;padding:40px}
h1{font-size:64px}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:40px}
.product-card{border:2px solid gold;padding:20px}
button{padding:10px 20px;background:#9c2418;color:white;border:none;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto}
.modal-box{background:black;padding:20px;max-height:90vh;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none}
.modal-box::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div class="hero"><h1>Cajun Cravings</h1></div>

<div class="product-grid">
  <div class="product-card"><h3>Classic</h3><button onclick="add()">Add to Cart</button></div>
  <div class="product-card"><h3>Crawfish</h3><button onclick="add()">Add to Cart</button></div>
  <div class="product-card"><h3>Sample</h3><button onclick="add()">Add to Cart</button></div>
</div>

<div class="modal" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button onclick="closeModal()">X</button>
    <h2>Pickup Order</h2>
    <p>Scroll works but scrollbar hidden</p>
    <div style="height:800px"></div>
    <button>Submit</button>
  </div>
</div>

<script>
function add(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
</script>

</body>
</html>
